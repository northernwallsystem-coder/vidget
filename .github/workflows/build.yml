name: Build Vidget APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tulis proyek Android
        run: |
          mkdir -p app/src/main/java/app/vidget/dl

          cat > settings.gradle <<'VIDGET_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Vidget"
          include ':app'
          VIDGET_EOF

          cat > build.gradle <<'VIDGET_EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          VIDGET_EOF

          cat > gradle.properties <<'VIDGET_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          VIDGET_EOF

          cat > app/build.gradle <<'VIDGET_EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'app.vidget.dl'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.vidget.dl'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          VIDGET_EOF

          cat > app/src/main/AndroidManifest.xml <<'VIDGET_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:label="Vidget Downloader"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          VIDGET_EOF

          cat > app/src/main/java/app/vidget/dl/MainActivity.java <<'VIDGET_EOF'
          package app.vidget.dl;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DownloadManager;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.res.ColorStateList;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.Message;
          import android.text.InputType;
          import android.text.TextUtils;
          import android.text.format.Formatter;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.EditorInfo;
          import android.webkit.CookieManager;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.BaseAdapter;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ListView;
          import android.widget.ProgressBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.ByteArrayInputStream;
          import java.util.ArrayList;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          public class MainActivity extends Activity {
              static final int ACC = 0xFF4F46E5, BG = 0xFFF6F7FB, TXT = 0xFF14161F, MUT = 0xFF6B7080, LINE = 0xFFE3E5EE;
              static final int MP = ViewGroup.LayoutParams.MATCH_PARENT, WC = ViewGroup.LayoutParams.WRAP_CONTENT;

              static final String HOME = "<html><head><meta name='viewport' content='width=device-width,initial-scale=1'><style>body{margin:0;font-family:sans-serif;background:#f6f7fb;color:#14161f;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.c{text-align:center;max-width:420px}h1{font-size:36px;margin:0 0 8px;background:linear-gradient(90deg,#4f46e5,#9333ea);-webkit-background-clip:text;color:transparent}p{color:#6b7080;line-height:1.7;margin:0}.s{background:#fff;border-radius:18px;padding:18px;margin-top:22px;text-align:left;box-shadow:0 2px 14px rgba(0,0,0,.07)}.s b{color:#4f46e5}</style></head><body><div class='c'><h1>Vidget</h1><p>Browser pengunduh dengan pemblokir iklan.</p><div class='s'><p><b>1.</b> Tempel link di kolom atas, lalu tekan Buka.<br><b>2.</b> Tekan tombol unduh di halaman situs.<br><b>3.</b> Pantau file di tab Unduhan.</p></div></div></body></html>";

              static final String[] ADS = {
                  "doubleclick.net", "googlesyndication.com", "googleadservices.com", "adservice.google.com",
                  "google-analytics.com", "adnxs.com", "adsrvr.org", "taboola.com", "outbrain.com", "mgid.com",
                  "revcontent.com", "popads.net", "popcash.net", "propellerads.com", "exoclick.com", "exosrv.com",
                  "juicyads.com", "adsterra.com", "highperformanceformat.com", "profitablecpmrate.com",
                  "trafficjunky.com", "trafficfactory.com", "clickadu.com", "hilltopads.net", "adcash.com",
                  "a-ads.com", "ad-maven.com", "admaven.com", "onclickads.net", "onclkds.com", "adskeeper.com",
                  "bidvertiser.com", "richpush.co", "monetag.com", "yllix.com", "tsyndicate.com", "realsrv.com",
                  "acscdn.com", "adspyglass.com", "adtng.com", "vidoomy.com", "media.net", "criteo.com",
                  "pubmatic.com", "rubiconproject.com", "openx.net", "amazon-adsystem.com", "2mdn.net",
                  "moatads.com", "scorecardresearch.com", "adform.net", "smartadserver.com", "casalemedia.com"
              };

              static class Item {
                  long id;
                  String title, mime;
                  int status;
                  long total, sofar;
              }

              private WebView web;
              private EditText bar;
              private ProgressBar prog;
              private TextView shield, tabBrowser, tabDl, emptyView;
              private LinearLayout header, dlPage;
              private ListView list;
              private BaseAdapter adapter;
              private final ArrayList<Item> items = new ArrayList<>();
              private final Handler h = new Handler(Looper.getMainLooper());
              private boolean adblock = true;
              private int blocked = 0, tab = 0;

              private final Runnable tick = new Runnable() {
                  @Override
                  public void run() {
                      refresh();
                      if (tab == 1) h.postDelayed(this, 1000);
                  }
              };

              private int dp(int v) {
                  return (int) (v * getResources().getDisplayMetrics().density + 0.5f);
              }

              private GradientDrawable round(int color, int r, int stroke) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(color);
                  g.setCornerRadius(dp(r));
                  if (stroke != 0) g.setStroke(dp(1), stroke);
                  return g;
              }

              private TextView btn(String t, boolean filled) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(14);
                  v.setTypeface(Typeface.DEFAULT_BOLD);
                  v.setGravity(Gravity.CENTER);
                  v.setPadding(dp(14), dp(9), dp(14), dp(9));
                  v.setTextColor(filled ? Color.WHITE : ACC);
                  if (filled) v.setBackground(round(ACC, 20, 0));
                  return v;
              }

              private TextView navTab(String t) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(14);
                  v.setTypeface(Typeface.DEFAULT_BOLD);
                  v.setGravity(Gravity.CENTER);
                  v.setPadding(dp(8), dp(14), dp(8), dp(14));
                  return v;
              }

              private boolean isAd(String host) {
                  if (host == null) return false;
                  for (String d : ADS) {
                      if (host.equals(d) || host.endsWith("." + d)) return true;
                  }
                  return false;
              }

              private void count() {
                  blocked++;
                  h.post(() -> updateShield());
              }

              private void updateShield() {
                  shield.setText("\uD83D\uDEE1 Pemblokir iklan: " + (adblock ? "AKTIF" : "MATI")
                          + " \u00B7 " + blocked + " diblokir (ketuk untuk ganti)");
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  if (Build.VERSION.SDK_INT <= 28) {
                      requestPermissions(new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE}, 1);
                  }
                  getWindow().setStatusBarColor(Color.WHITE);
                  getWindow().setNavigationBarColor(Color.WHITE);
                  getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(BG);

                  header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  header.setBackgroundColor(Color.WHITE);
                  header.setPadding(dp(12), dp(10), dp(12), 0);

                  LinearLayout pill = new LinearLayout(this);
                  pill.setGravity(Gravity.CENTER_VERTICAL);
                  pill.setBackground(round(0xFFF1F2F8, 26, 0));
                  pill.setPadding(dp(16), dp(2), dp(6), dp(2));
                  bar = new EditText(this);
                  bar.setBackground(null);
                  bar.setHint("Tempel link di sini");
                  bar.setTextSize(15);
                  bar.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_URI);
                  bar.setImeOptions(EditorInfo.IME_ACTION_GO);
                  TextView paste = btn("Tempel", false);
                  TextView go = btn("Buka", true);
                  pill.addView(bar, new LinearLayout.LayoutParams(0, WC, 1f));
                  pill.addView(paste);
                  pill.addView(go);
                  header.addView(pill, new LinearLayout.LayoutParams(MP, WC));

                  shield = new TextView(this);
                  shield.setTextSize(12);
                  shield.setTextColor(MUT);
                  shield.setPadding(dp(8), dp(8), dp(8), dp(8));
                  updateShield();
                  header.addView(shield);

                  prog = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  prog.setMax(100);
                  prog.setProgressTintList(ColorStateList.valueOf(ACC));
                  header.addView(prog, new LinearLayout.LayoutParams(MP, dp(3)));
                  root.addView(header, new LinearLayout.LayoutParams(MP, WC));

                  FrameLayout content = new FrameLayout(this);
                  web = new WebView(this);
                  content.addView(web, new FrameLayout.LayoutParams(MP, MP));

                  dlPage = new LinearLayout(this);
                  dlPage.setOrientation(LinearLayout.VERTICAL);
                  dlPage.setBackgroundColor(BG);
                  dlPage.setVisibility(View.GONE);
                  LinearLayout dh = new LinearLayout(this);
                  dh.setGravity(Gravity.CENTER_VERTICAL);
                  dh.setBackgroundColor(Color.WHITE);
                  dh.setPadding(dp(18), dp(12), dp(10), dp(12));
                  TextView dt = new TextView(this);
                  dt.setText("Unduhan");
                  dt.setTextSize(20);
                  dt.setTextColor(TXT);
                  dt.setTypeface(Typeface.DEFAULT_BOLD);
                  TextView folder = btn("Folder", false);
                  dh.addView(dt, new LinearLayout.LayoutParams(0, WC, 1f));
                  dh.addView(folder);
                  dlPage.addView(dh, new LinearLayout.LayoutParams(MP, WC));

                  FrameLayout lf = new FrameLayout(this);
                  list = new ListView(this);
                  list.setDivider(null);
                  list.setDividerHeight(0);
                  list.setPadding(0, dp(6), 0, dp(6));
                  list.setClipToPadding(false);
                  adapter = new BaseAdapter() {
                      @Override
                      public int getCount() {
                          return items.size();
                      }

                      @Override
                      public Object getItem(int i) {
                          return items.get(i);
                      }

                      @Override
                      public long getItemId(int i) {
                          return items.get(i).id;
                      }

                      @Override
                      public View getView(int pos, View cv, ViewGroup parent) {
                          return rowFor(items.get(pos));
                      }
                  };
                  list.setAdapter(adapter);
                  emptyView = new TextView(this);
                  emptyView.setText("Belum ada unduhan.\nFile yang Anda unduh akan muncul di sini.");
                  emptyView.setTextColor(MUT);
                  emptyView.setGravity(Gravity.CENTER);
                  lf.addView(list, new FrameLayout.LayoutParams(MP, MP));
                  lf.addView(emptyView, new FrameLayout.LayoutParams(MP, MP));
                  dlPage.addView(lf, new LinearLayout.LayoutParams(MP, 0, 1f));
                  content.addView(dlPage, new FrameLayout.LayoutParams(MP, MP));
                  root.addView(content, new LinearLayout.LayoutParams(MP, 0, 1f));

                  View line = new View(this);
                  line.setBackgroundColor(LINE);
                  root.addView(line, new LinearLayout.LayoutParams(MP, dp(1)));
                  LinearLayout nav = new LinearLayout(this);
                  nav.setBackgroundColor(Color.WHITE);
                  tabBrowser = navTab("\uD83C\uDF10  Browser");
                  tabDl = navTab("\u2B07  Unduhan");
                  nav.addView(tabBrowser, new LinearLayout.LayoutParams(0, WC, 1f));
                  nav.addView(tabDl, new LinearLayout.LayoutParams(0, WC, 1f));
                  root.addView(nav, new LinearLayout.LayoutParams(MP, WC));
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setSupportMultipleWindows(true);
                  s.setUserAgentString(s.getUserAgentString().replace("; wv", ""));
                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest req) {
                          String sc = req.getUrl().getScheme();
                          if (!("http".equals(sc) || "https".equals(sc))) return true;
                          if (adblock && isAd(req.getUrl().getHost())) {
                              count();
                              return true;
                          }
                          return false;
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req) {
                          if (adblock && isAd(req.getUrl().getHost())) {
                              count();
                              return new WebResourceResponse("text/plain", "utf-8", new ByteArrayInputStream(new byte[0]));
                          }
                          return null;
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap icon) {
                          bar.setText(url != null && url.startsWith("http") ? url : "");
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onProgressChanged(WebView view, int p) {
                          prog.setProgress(p);
                          prog.setVisibility(p >= 100 ? View.INVISIBLE : View.VISIBLE);
                      }

                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          if (adblock) {
                              count();
                              return false;
                          }
                          WebView tmp = new WebView(MainActivity.this);
                          tmp.setWebViewClient(new WebViewClient() {
                              @Override
                              public boolean shouldOverrideUrlLoading(WebView x, WebResourceRequest r) {
                                  web.loadUrl(r.getUrl().toString());
                                  return true;
                              }
                          });
                          ((WebView.WebViewTransport) resultMsg.obj).setWebView(tmp);
                          resultMsg.sendToTarget();
                          return true;
                      }
                  });

                  web.setDownloadListener((url, ua, cd, mime, len) -> {
                      try {
                          if (url.startsWith("blob:") || url.startsWith("data:")) {
                              Toast.makeText(this, "Jenis unduhan ini belum didukung", Toast.LENGTH_LONG).show();
                              return;
                          }
                          String name = URLUtil.guessFileName(url, cd, mime);
                          DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                          String ck = CookieManager.getInstance().getCookie(url);
                          if (ck != null) r.addRequestHeader("Cookie", ck);
                          if (ua != null) r.addRequestHeader("User-Agent", ua);
                          if (web.getUrl() != null) r.addRequestHeader("Referer", web.getUrl());
                          if (mime != null) r.setMimeType(mime);
                          r.setTitle(name);
                          r.allowScanningByMediaScanner();
                          r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                          r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                          ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).enqueue(r);
                          Toast.makeText(this, "Mengunduh: " + name + "\nLihat di tab Unduhan", Toast.LENGTH_LONG).show();
                      } catch (Exception e) {
                          Toast.makeText(this, "Gagal: " + e.getMessage(), Toast.LENGTH_LONG).show();
                      }
                  });

                  go.setOnClickListener(v -> load(bar.getText().toString()));
                  bar.setOnEditorActionListener((v, a, e) -> {
                      load(bar.getText().toString());
                      return true;
                  });
                  paste.setOnClickListener(v -> {
                      ClipboardManager cb = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      ClipData d = cb.getPrimaryClip();
                      if (d != null && d.getItemCount() > 0 && d.getItemAt(0).getText() != null) {
                          bar.setText(d.getItemAt(0).getText());
                          load(bar.getText().toString());
                      }
                  });
                  shield.setOnClickListener(v -> {
                      adblock = !adblock;
                      updateShield();
                      web.reload();
                  });
                  tabBrowser.setOnClickListener(v -> showTab(0));
                  tabDl.setOnClickListener(v -> showTab(1));
                  folder.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(DownloadManager.ACTION_VIEW_DOWNLOADS));
                      } catch (Exception e) {
                          Toast.makeText(this, "Buka folder Download lewat aplikasi File", Toast.LENGTH_LONG).show();
                      }
                  });

                  showTab(0);
                  web.loadDataWithBaseURL(null, HOME, "text/html", "utf-8", null);
                  handle(getIntent());
              }

              private void showTab(int t) {
                  tab = t;
                  header.setVisibility(t == 0 ? View.VISIBLE : View.GONE);
                  web.setVisibility(t == 0 ? View.VISIBLE : View.GONE);
                  dlPage.setVisibility(t == 1 ? View.VISIBLE : View.GONE);
                  tabBrowser.setTextColor(t == 0 ? ACC : MUT);
                  tabDl.setTextColor(t == 1 ? ACC : MUT);
                  h.removeCallbacks(tick);
                  if (t == 1) {
                      refresh();
                      h.postDelayed(tick, 1000);
                  }
              }

              private void refresh() {
                  items.clear();
                  DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                  Cursor c = dm.query(new DownloadManager.Query());
                  if (c != null) {
                      try {
                          while (c.moveToNext()) {
                              Item it = new Item();
                              it.id = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_ID));
                              it.title = c.getString(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TITLE));
                              it.mime = c.getString(c.getColumnIndexOrThrow(DownloadManager.COLUMN_MEDIA_TYPE));
                              it.status = c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                              it.total = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                              it.sofar = c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                              items.add(it);
                          }
                      } finally {
                          c.close();
                      }
                  }
                  adapter.notifyDataSetChanged();
                  emptyView.setVisibility(items.isEmpty() ? View.VISIBLE : View.GONE);
              }

              private View rowFor(final Item it) {
                  LinearLayout outer = new LinearLayout(this);
                  outer.setPadding(dp(12), dp(6), dp(12), dp(6));
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  card.setBackground(round(Color.WHITE, 14, LINE));
                  card.setPadding(dp(14), dp(12), dp(14), dp(6));

                  TextView t = new TextView(this);
                  t.setText(it.title == null ? "File" : it.title);
                  t.setTextColor(TXT);
                  t.setTextSize(15);
                  t.setTypeface(Typeface.DEFAULT_BOLD);
                  t.setMaxLines(2);
                  t.setEllipsize(TextUtils.TruncateAt.END);
                  card.addView(t);

                  TextView s = new TextView(this);
                  s.setTextSize(13);
                  s.setTextColor(MUT);
                  s.setPadding(0, dp(4), 0, dp(4));
                  String size = Formatter.formatShortFileSize(this, it.total > 0 ? it.total : it.sofar);
                  boolean running = false;
                  if (it.status == DownloadManager.STATUS_SUCCESSFUL) {
                      s.setText("Selesai \u00B7 " + size);
                  } else if (it.status == DownloadManager.STATUS_FAILED) {
                      s.setText("Gagal diunduh");
                      s.setTextColor(0xFFDC2626);
                  } else if (it.status == DownloadManager.STATUS_PAUSED) {
                      s.setText("Dijeda, menunggu jaringan");
                  } else if (it.status == DownloadManager.STATUS_PENDING) {
                      s.setText("Menunggu...");
                  } else {
                      running = true;
                      int pct = it.total > 0 ? (int) (it.sofar * 100 / it.total) : 0;
                      s.setText(it.total > 0 ? "Mengunduh " + pct + "% \u00B7 " + size : "Mengunduh \u00B7 " + size);
                  }
                  card.addView(s);

                  if (running && it.total > 0) {
                      ProgressBar p = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                      p.setMax(100);
                      p.setProgress((int) (it.sofar * 100 / it.total));
                      p.setProgressTintList(ColorStateList.valueOf(ACC));
                      card.addView(p, new LinearLayout.LayoutParams(MP, dp(4)));
                  }

                  LinearLayout acts = new LinearLayout(this);
                  acts.setGravity(Gravity.END);
                  if (it.status == DownloadManager.STATUS_SUCCESSFUL) {
                      TextView open = btn("Buka", false);
                      open.setOnClickListener(v -> openFile(it));
                      acts.addView(open);
                  }
                  TextView del = btn(running ? "Batal" : "Hapus", false);
                  del.setTextColor(0xFFDC2626);
                  del.setOnClickListener(v -> confirmDelete(it));
                  acts.addView(del);
                  card.addView(acts, new LinearLayout.LayoutParams(MP, WC));

                  outer.addView(card, new LinearLayout.LayoutParams(MP, WC));
                  return outer;
              }

              private void openFile(Item it) {
                  try {
                      DownloadManager dm = (DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE);
                      Intent i = new Intent(Intent.ACTION_VIEW);
                      i.setDataAndType(dm.getUriForDownloadedFile(it.id), it.mime != null ? it.mime : "*/*");
                      i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(this, "Tidak ada aplikasi untuk membuka file ini. Cek folder Download.", Toast.LENGTH_LONG).show();
                  }
              }

              private void confirmDelete(final Item it) {
                  new AlertDialog.Builder(this)
                          .setMessage("Hapus unduhan ini beserta filenya?")
                          .setPositiveButton("Hapus", (dlg, w) -> {
                              ((DownloadManager) getSystemService(Context.DOWNLOAD_SERVICE)).remove(it.id);
                              refresh();
                          })
                          .setNegativeButton("Batal", null)
                          .show();
              }

              private void load(String t) {
                  t = t.trim();
                  if (t.isEmpty()) return;
                  if (!t.startsWith("http://") && !t.startsWith("https://")) t = "https://" + t;
                  showTab(0);
                  web.loadUrl(t);
              }

              private void handle(Intent i) {
                  if (i != null && Intent.ACTION_SEND.equals(i.getAction())) {
                      String t = i.getStringExtra(Intent.EXTRA_TEXT);
                      if (t != null) {
                          Matcher m = Pattern.compile("https?://\\S+").matcher(t);
                          if (m.find()) {
                              bar.setText(m.group());
                              load(m.group());
                          }
                      }
                  }
              }

              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  handle(i);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  h.removeCallbacks(tick);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (tab == 1) showTab(1);
              }

              @Override
              public void onBackPressed() {
                  if (tab == 1) showTab(0);
                  else if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          VIDGET_EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: Vidget-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Buat Release (APK bisa diunduh langsung)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Vidget.apk
          gh release create "v${{ github.run_number }}" Vidget.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Vidget v${{ github.run_number }}" \
            --notes "APK siap dipasang."
